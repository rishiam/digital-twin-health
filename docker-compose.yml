services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: digitwin
      POSTGRES_PASSWORD: digitwin
      POSTGRES_DB: digitwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://digitwin:digitwin@db:5432/digitwin
      JWT_SECRET: local-dev-secret-change-me
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO_USERS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
