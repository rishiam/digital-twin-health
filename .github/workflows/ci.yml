name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Test Suite
        env:
          DATABASE_URL: sqlite+pysqlite:///./test.db
          JWT_SECRET: ci-secret-key-production-testing
          SEED_DEMO_USERS: "true"
          PYTHONPATH: .
        run: python -m pytest tests -v

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn
      - name: Test Synthetic Dataset Generation
        run: python ml/generate_datasets.py --n 100 --out ml/data/test_ci
      - name: Test Glucose Benchmarking
        run: python ml/train_glucose.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & Build Frontend
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.up.railway.app
